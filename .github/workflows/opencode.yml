name: opencode

# Replaces the retired OpenCode GitHub Action (removed upstream in v2.2.0).
# The old action fetched its own version with an *unauthenticated* call to
# api.github.com, which is limited to 60 requests/hour per shared runner IP and
# regularly failed with "API rate limit exceeded". Installing the CLI from npm
# avoids that GitHub API call entirely.
#
# Trigger: comment `/oc <request>` or `/opencode <request>` on an issue/PR.
#
# Optional repo configuration (Settings -> Secrets and variables -> Actions):
#   Secret   OPENCODE_API_KEY  API key for the model provider (paid models).
#   Variable OPENCODE_MODEL    provider/model to use. Defaults to the free model.
# If you hit "Rate limit exceeded. Please try again later", that is the model
# provider (not GitHub): add OPENCODE_API_KEY and point OPENCODE_MODEL at a
# paid model.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    # Only trusted users can spend the model key and push branches.
    if: >
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'opencode/big-pickle' }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      EVENT_NAME: ${{ github.event_name }}
      REPO: ${{ github.repository }}
      COMMENT_BODY: ${{ github.event.comment.body }}
      COMMENT_PATH: ${{ github.event.comment.path }}
      COMMENT_LINE: ${{ github.event.comment.line }}
      COMMENT_DIFF: ${{ github.event.comment.diff_hunk }}
      ISSUE_TITLE: ${{ github.event.issue.title || github.event.pull_request.title }}
      ISSUE_BODY: ${{ github.event.issue.body || github.event.pull_request.body }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenCode (pinned)
        run: npm install --global @opencode/cli@2.2.7

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build prompt
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/prompt.txt" <<'PY'
          import os
          import sys

          body = os.environ.get("COMMENT_BODY", "") or ""
          for token in ("/opencode", "/oc"):
              body = body.replace(token, "")

          lines = [
              f"You are OpenCode running inside GitHub Actions for {os.environ['REPO']}.",
              f"Event: {os.environ['EVENT_NAME']}",
              f"Issue/PR #{os.environ['ISSUE_NUMBER']}: {os.environ.get('ISSUE_TITLE', '')}",
              "",
              "Issue/PR description:",
              (os.environ.get("ISSUE_BODY", "") or "(none)")[:8000],
          ]

          path = os.environ.get("COMMENT_PATH") or ""
          if path:
              lines += [
                  "",
                  f"Review comment on file: {path}, line {os.environ.get('COMMENT_LINE', '')}",
                  "Diff hunk:",
                  "```diff",
                  (os.environ.get("COMMENT_DIFF", "") or "")[:8000],
                  "```",
              ]

          lines += [
              "",
              "Request from the comment:",
              body.strip() or "(no instruction; explain what you would do)",
              "",
              "Work in the checked-out repository. Keep changes minimal and run the",
              "project's tests or build when they are available. If you change files,",
              "leave them in the working tree; the workflow commits them to a branch",
              "and opens a pull request.",
          ]

          open(sys.argv[1], "w").write("\n".join(lines))
          PY

      - name: Run OpenCode
        id: run
        shell: bash
        run: |
          set -uo pipefail
          EVENTS="$RUNNER_TEMP/events.jsonl"
          ERR="$RUNNER_TEMP/opencode.err"
          REPLY="$RUNNER_TEMP/reply.md"

          opencode run --standalone --auto --format json \
            --model "$OPENCODE_MODEL" "$(cat "$RUNNER_TEMP/prompt.txt")" \
            >"$EVENTS" 2>"$ERR"
          STATUS=$?

          python3 - "$EVENTS" "$REPLY" "$STATUS" "$ERR" <<'PY'
          import json
          import sys

          events, reply_path, status, err_path = sys.argv[1:5]
          texts, errors = [], []
          try:
              with open(events) as fh:
                  for line in fh:
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          event = json.loads(line)
                      except json.JSONDecodeError:
                          continue
                      if event.get("type") == "text":
                          part = event.get("part") or {}
                          if part.get("type") == "text" and part.get("text"):
                              texts.append(part["text"])
                      elif event.get("type") == "error":
                          errors.append(json.dumps(event.get("error") or event))
          except FileNotFoundError:
              pass

          reply = "\n\n".join(texts).strip()
          if not reply:
              reply = "OpenCode produced no reply."
              if errors:
                  reply += "\n\n```\n" + "\n".join(errors) + "\n```"
          if status != "0":
              try:
                  stderr = open(err_path).read().strip()
              except OSError:
                  stderr = ""
              if stderr:
                  reply += "\n\n```\n" + stderr[-4000:] + "\n```"
          open(reply_path, "w").write(reply)
          PY

          if [ "$STATUS" -ne 0 ]; then
            echo "OpenCode exited with status $STATUS"
            exit "$STATUS"
          fi

      - name: Publish result
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          REPLY="$RUNNER_TEMP/reply.md"
          if [ ! -s "$REPLY" ]; then
            echo "OpenCode produced no reply; nothing to publish."
            exit 0
          fi
          {
            echo "<!-- opencode-bot -->"
            echo
            cat "$REPLY"
            echo
            echo "_Model: \`$OPENCODE_MODEL\` · [run]($GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID)_"
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md"

      - name: Open pull request for changes
        if: success()
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No file changes."
            exit 0
          fi
          BRANCH="opencode/issue-${ISSUE_NUMBER}-$(date +%s)"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "opencode: address #${ISSUE_NUMBER}"
          git push origin "$BRANCH"
          gh pr create \
            --base "$DEFAULT_BRANCH" \
            --head "$BRANCH" \
            --title "opencode: address #${ISSUE_NUMBER}" \
            --body-file "$RUNNER_TEMP/reply.md"
